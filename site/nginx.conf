# ФНСКит — раздача статики и обратный прокси к API.
#
# Контейнер работает ЗА Traefik (Dokploy): TLS, HTTP/2, редирект на https и
# сертификаты — забота Traefik, здесь слушаем обычный 80 внутри docker-сети и
# наружу порт не публикуем. Наружу торчит только этот сервис: processor
# доступен исключительно через /api/processor/... на том же origin, поэтому CORS
# не нужен.

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    # В Alpine mime.types не содержит ни расширение ES-модулей .mjs, ни
    # .webmanifest. Без явного типа браузер отклоняет динамический import()
    # PDF.js, а манифест уезжает как application/octet-stream мимо gzip_types.
    types {
        application/javascript      mjs;
        application/manifest+json   webmanifest;
    }
    default_type  application/octet-stream;
    charset       utf-8;
    charset_types text/html text/css text/plain text/xml application/javascript
                  application/json application/rss+xml image/svg+xml;
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65s;

    # Медленные клиенты не должны занимать соединения бесконечно.
    client_body_timeout   30s;
    client_header_timeout 15s;
    send_timeout          60s;
    # Глобально держим тело запроса маленьким: большой аплоад разрешён точечно,
    # только на ручке процессора.
    client_max_body_size  64k;

    # --- Настоящий IP клиента ------------------------------------------------
    # До приложения запрос идёт как «клиент → Traefik → nginx», поэтому
    # $remote_addr здесь — адрес контейнера Traefik. Доверяем X-Forwarded-For
    # только от приватных docker-подсетей и восстанавливаем реальный адрес: от
    # него зависят и логи, и лимитеры (свои и в приложениях).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # $request and Referer may contain query strings (for example payment
    # callback signatures), so log only the path and request metadata.
    log_format main '$remote_addr - $status "$request_method $uri $server_protocol" $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time '
                    'ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    # Для ссылок /s/<токен>: путь не пишем, в нём ключ доступа к файлу.
    log_format shared_link '$remote_addr - $status "$request_method /s/*** $server_protocol" $body_bytes_sent '
                           '"$http_user_agent" rt=$request_time ut=$upstream_response_time';
    error_log  /var/log/nginx/error.log warn;

    # --- Лимиты запросов -----------------------------------------------------
    # Грубый заслон от перебора и ботов. Точные лимиты по ручкам остаются в
    # приложениях (RATE_LIMIT_*), здесь только потолок, до которого запрос
    # вообще доходит до Python.
    limit_req_zone  $binary_remote_addr zone=api:10m    rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=static:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    # Одновременные загрузки файлов. Ручка процессора анонимная, а тело запроса
    # оседает во временном файле на диске процессора ещё до любых проверок (до
    # 110 МБ на запрос), поэтому число таких запросов считаем и с одного адреса,
    # и по всему сайту. Второй потолок держит диск при любом числе адресов у
    # атакующего; сам процессор дополнительно ограничивает сумму принятых
    # загрузок (MAX_STAGED_MEGABYTES) и отвечает 503 сверх неё.
    limit_conn_zone $binary_remote_addr zone=upload_ip:10m;
    limit_conn_zone $server_name        zone=upload_all:64k;
    # Отправка форм Keycloak (вход, код 2FA, регистрация, сброс пароля) и
    # обмен кода на токены — POST в /auth/. Пустой ключ nginx не считает,
    # поэтому GET-запросы страниц и ресурсов под этот лимит не попадают.
    # Перебор паролей и кодов для конкретного аккаунта Keycloak останавливает
    # сам (bruteForceProtected в realm), здесь — потолок с одного адреса.
    map $request_method $auth_form_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $auth_form_key zone=auth_forms:10m rate=30r/m;
    limit_req_status  429;
    limit_conn_status 429;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json application/rss+xml;

    # --- Проксирование -------------------------------------------------------
    # Резолвер docker: адреса контейнеров берём в рантайме. Без этого nginx
    # запоминает IP при старте и после перезапуска processor продолжает
    # стучаться по мёртвому адресу до ручного reload.
    resolver         127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Намеренно НЕ $proxy_add_x_forwarded_for: приложения берут самый правый
    # элемент X-Forwarded-For, и дописанный сюда адрес контейнера Traefik
    # склеил бы всех клиентов в один IP — лимитеры стали бы общими на всех.
    # $remote_addr тут уже настоящий клиент, его восстановил real_ip выше.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    # Ответ апстрима не копим во временном файле. Иначе медленный клиент,
    # скачивающий TIFF на сотню мегабайт, заставил бы nginx сложить его в
    # /var/cache/nginx, а это tmpfs, то есть память контейнера с лимитом в
    # 48 МБ: ядро убило бы воркер вместе с чужими соединениями. Без файла nginx
    # держит только proxy_buffers и читает апстрим со скоростью клиента.
    proxy_max_temp_file_size 0;
    # Ошибки апстрима отдаём как есть: подменять JSON приложения на HTML-страницу
    # нельзя, фронтенд разбирает поле detail.
    proxy_intercept_errors off;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /srv/www;
        # index намеренно не включаем: он делает внутренний переход на
        # /index.html, а тот отдельным правилом ниже редиректится на / — вышла
        # бы петля. Главную обслуживает location = / .
        index off;

        # За прокси собственные редиректы nginx должны быть относительными,
        # иначе в Location утечёт внутреннее имя контейнера и порт.
        absolute_redirect off;
        port_in_redirect  off;

        limit_conn perip 20;

        add_header X-Content-Type-Options "nosniff"                     always;
        add_header X-Frame-Options        "DENY"                        always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()" always;
        # Сайт закрыт от индексации (прототип): заголовок действует на любой ответ,
        # включая картинки, JSON API и страницы ошибок. Дублирует meta robots в
        # страницах и Disallow в robots.txt. Чтобы открыть сайт, уберите строку и
        # прочитайте docs/DESIGN.md, раздел «Индексация».
        add_header X-Robots-Tag           "noindex, nofollow, noarchive"  always;
        # Only resources actually used by the site are allowed. CSS keeps
        # unsafe-inline temporarily because the current static pages contain
        # small inline style blocks and attributes; scripts do not.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        # Force HTTPS for this host after its first successful HTTPS visit.
        # Subdomains are intentionally excluded: they may be served separately.
        add_header Strict-Transport-Security "max-age=31536000" always;

        error_page 404 /404.html;
        # 403 не подтверждаем: пусть выглядит как несуществующий путь.
        error_page 403 =404 /404.html;
        error_page 413 /413.html;
        error_page 429 /429.html;
        error_page 500 502 504 /50x.html;
        error_page 503 /503.html;

        location = /404.html { internal; }
        location = /413.html { internal; }
        location = /429.html { internal; }
        location = /50x.html { internal; }
        location = /503.html { internal; }

        # Проверка живости самого nginx (healthcheck контейнера, мониторинг).
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }


        # --- API ------------------------------------------------------------
        # Документация API и проверки здоровья наружу не идут.
        location ~ ^/api/processor/(docs|redoc|openapi\.json|health) { return 404; }

        location /api/processor/ {
            limit_req zone=api burst=20 nodelay;
            # Не больше двух одновременных загрузок с адреса и шести на весь сайт:
            # обработка всё равно идёт по одной (MAX_CONCURRENT_JOBS), остальные
            # ждут очереди. Директивы limit_conn в location отменяют
            # унаследованный perip (20 на адрес): он мягче upload_ip.
            limit_conn upload_ip 2;
            limit_conn upload_all 6;
            error_page 429 = @api_too_many;
            error_page 413 = @api_too_large;
            error_page 502 504 = @api_unavailable;

            # Чуть выше MAX_TOTAL_BYTES (100 МиБ): решение о превышении должен
            # принимать процессор со своим текстом ошибки, а не nginx.
            client_max_body_size 110m;
            # Не копим сотню мегабайт во временный файл перед отправкой — льём в
            # процессор потоком, он и так читает загрузку кусками.
            proxy_request_buffering off;
            # Сборка многостраничного TIFF — минуты, а не секунды.
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            set $processor_upstream http://processor:8080;
            rewrite ^/api/processor/(.*)$ /$1 break;
            proxy_pass $processor_upstream;
        }

        # Кабинет: профиль, набор документов и загруженные файлы.
        location ~ ^/api/cabinet/(docs|redoc|openapi\.json|health) { return 404; }
        # Скачивание по ссылке открыто только через короткий адрес /s/ ниже:
        # там токен не попадает в журнал, а здесь попал бы в $uri.
        location ^~ /api/cabinet/v1/shared/ { return 404; }

        location /api/cabinet/ {
            limit_req zone=api burst=20 nodelay;
            error_page 429 = @api_too_many;
            error_page 413 = @cabinet_too_large;
            error_page 502 504 = @api_unavailable;

            # Чуть выше предела файла в кабинете (20 МБ): точный предел и
            # понятный текст ошибки — у самого сервиса.
            client_max_body_size 21m;
            # Файл идёт в кабинет потоком, без промежуточного файла у nginx.
            proxy_request_buffering off;

            set $cabinet_upstream http://cabinet:8080;
            rewrite ^/api/cabinet/(.*)$ /$1 break;
            proxy_pass $cabinet_upstream;
        }

        location @cabinet_too_large {
            default_type application/json;
            return 413 '{"detail":"Файл больше 20 МБ. Сожмите скан или разбейте документ на части."}';
        }

        # Ссылка на документ, которой владелец поделился: /s/<токен>. Токен —
        # это и есть доступ к файлу, поэтому в журнал вместо пути пишется
        # заглушка, а журнал ошибок здесь молчит: nginx пишет в него строку
        # запроса целиком.
        location ^~ /s/ {
            limit_req zone=api burst=20 nodelay;
            access_log /var/log/nginx/access.log shared_link;
            error_log  /var/log/nginx/error.log emerg;

            # Нет файла или срок вышел — понятная страница вместо JSON.
            proxy_intercept_errors on;
            error_page 404 /link-expired.html;
            error_page 502 504 =503 /503.html;

            set $cabinet_upstream http://cabinet:8080;
            rewrite ^/s/(.*)$ /v1/shared/$1 break;
            proxy_pass $cabinet_upstream;
        }

        location = /link-expired.html { internal; }

        # На API отвечаем JSON: фронтенд ждёт detail, а не HTML-страницу.
        location @api_too_many {
            default_type application/json;
            return 429 '{"detail":"Слишком много запросов. Подождите минуту и попробуйте снова."}';
        }

        location @api_too_large {
            default_type application/json;
            return 413 '{"detail":"Файлы слишком большие: суммарный размер не должен превышать 100 МБ."}';
        }

        # Сервис не поднялся или перезапускается. HTML-страницу отдавать нельзя:
        # фронтенд ждёт JSON и показал бы в модалке кусок разметки.
        location @api_unavailable {
            default_type application/json;
            return 503 '{"detail":"Сервис временно недоступен. Попробуйте через пару минут."}';
        }

        # --- Аккаунты (Keycloak) -----------------------------------------------
        # Keycloak живёт на том же домене под /auth/: вход, регистрация, 2FA,
        # личный кабинет аккаунта и протокол OpenID Connect. Один origin с
        # сайтом — значит, ни CORS, ни сторонних cookie для тихой проверки входа.
        #
        # Админка и служебный realm master наружу не отдаются: администрировать
        # можно только с сервера (backend/README.md, раздел «Аккаунты»).
        location = /auth  { return 404; }
        location = /auth/ { return 404; }
        location ^~ /auth/admin/         { return 404; }
        location ^~ /auth/realms/master/ { return 404; }

        # ^~ обязателен: иначе регулярные location ниже перехватили бы ресурсы
        # Keycloak (*.css, *.js, *.html) и отдали бы их как статику сайта.
        location ^~ /auth/ {
            limit_req zone=static burst=60 nodelay;
            limit_req zone=auth_forms burst=10 nodelay;
            # Keycloak ещё стартует или перезапускается — понятная страница 503.
            error_page 502 504 =503 /503.html;

            # Заголовки безопасности у Keycloak свои: его страницы используют
            # встроенные скрипты, которые CSP сайта запретила бы, а проверка
            # входа идёт во фрейме того же origin (X-Frame-Options SAMEORIGIN).
            # Свой add_header здесь отменяет наследование заголовков server.
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()" always;

            # Keycloak шлёт длинные заголовки: cookie сессии и Location с
            # параметрами OIDC. Буферов по умолчанию не хватает — был бы 502.
            proxy_buffer_size       16k;
            proxy_buffers           8 16k;
            proxy_busy_buffers_size 32k;

            set $keycloak_upstream http://keycloak:8080;
            proxy_pass $keycloak_upstream;
        }

        # Страница, которую keycloak-js открывает в скрытом фрейме кабинета,
        # чтобы без перезагрузки узнать, вошёл ли пользователь. Единственная
        # страница сайта, которую можно встраивать, и только в сам сайт.
        location = /silent-check-sso {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy        "no-referrer" always;
            add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
            try_files /silent-check-sso.html =404;
            expires -1;
        }

        # --- Статика ----------------------------------------------------------
        location ~ /\. { deny all; }

        # Старые адреса с .html — навсегда на канонические без расширения.
        # Именно location, а не rewrite на уровне server: server-level rewrite
        # сработал бы и на внутреннем переходе к /404.html, зациклив ошибки.
        location = /index.html { return 301 /; }
        # Кабинет переехал с транслитерации /kabinet на /account. Якорь вкладки
        # (#actions) браузер переносит через редирект сам.
        location = /kabinet      { return 301 /account$is_args$args; }
        location = /kabinet.html { return 301 /account$is_args$args; }
        location ~ ^/(?<page>.+)\.html$ {
            return 301 /$page$is_args$args;
        }

        location ~* \.(?:css|js)$ {
            # Файлы без хэша в имени, версия задаётся ?v= в ссылке — держим
            # кэш коротким, чтобы деплой не разъезжался с браузером.
            expires 1h;
        }

        location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?)$ {
            expires 30d;
        }

        # Отдаём настоящий favicon.ico из корня. Подменять его на logo.svg
        # нельзя: try_files меняет и MIME-тип, и по адресу с .ico приезжает
        # SVG — робот Яндекса такую фавиконку загрузить не может. SVG-вариант
        # страницы объявляют отдельной ссылкой на /images/logo.svg.
        location = /favicon.ico {
            expires 30d;
        }

        location = /robots.txt  { expires 1h; }

        location = / {
            limit_req zone=static burst=60 nodelay;
            try_files /index.html =404;
            expires -1;
        }

        location / {
            limit_req zone=static burst=60 nodelay;
            # Чистые адреса: /privacy отдаёт privacy.html.
            try_files $uri $uri.html =404;
            # HTML всегда перепроверяем — иначе после деплоя у части
            # посетителей останется старая страница с прежними ценами.
            expires -1;
        }
    }
}
