# Тема страниц входа ФНСКит: штатная keycloak.v2 (PatternFly 5) с цветами,
# шрифтом и логотипом сайта. Разметку не переопределяем — только стили и
# тексты, поэтому обновление Keycloak не ломает шаблоны.
parent=keycloak.v2
import=common/keycloak

# css/styles.css берётся из родительской темы, fnskit.css кладётся поверх.
styles=css/styles.css css/fnskit.css

# У сайта нет тёмной темы — страницы входа тоже всегда светлые.
darkMode=false

locales=ru

# Выбор из нескольких вариантов (форма бизнеса) — переключатель-«таблетки»,
# а не выпадающий список: список рисует операционная система, и стилям он не
# поддаётся. Классы разобраны в resources/css/fnskit.css.
kcInputClassRadio=fnskit-choice
kcInputClassRadioInput=fnskit-choice__input
kcInputClassRadioLabel=fnskit-choice__label
