# Тексты писем ФНСКит. Остальные письма (уведомления о событиях, тестовое)
# берут перевод Keycloak. В тексте нет апострофов: MessageFormat требует их
# удваивать.

# Темы писем
emailVerificationSubject=Подтвердите почту — ФНСКит
passwordResetSubject=Сброс пароля — ФНСКит
executeActionsSubject=Обновление аккаунта — ФНСКит

# Текстовая версия (для клиентов без HTML). {0} — ссылка, {2} — название, {3} — срок.
emailVerificationBody=Здравствуйте! Кто-то создал аккаунт в {2} с этим адресом. Если это вы, подтвердите почту по ссылке:\n\n{0}\n\nСсылка действует {3}.\n\nЕсли вы не создавали аккаунт, просто проигнорируйте письмо.
passwordResetBody=Здравствуйте! Кто-то запросил смену пароля для аккаунта в {2}. Если это вы, перейдите по ссылке:\n\n{0}\n\nСсылка действует {3}. Если у вас включена двухфакторная защита, перед сменой пароля спросим код из приложения.\n\nЕсли вы не запрашивали сброс, ничего не делайте: пароль останется прежним.
executeActionsBody=Здравствуйте! Администратор {2} просит вас обновить данные аккаунта: {3}. Перейдите по ссылке:\n\n{0}\n\nСсылка действует {4}.\n\nЕсли это письмо для вас неожиданно, проигнорируйте его.

